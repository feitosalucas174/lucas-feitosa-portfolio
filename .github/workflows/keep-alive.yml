name: Keep Render Services Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chatbot-ia
            url: https://chatbot-ia-mkmw.onrender.com
            service_id: srv-d7i2nu3bc2fs73dnj9bg
          - name: api-rest-node
            url: https://api-rest-node-5mjb.onrender.com/api/docs/
            service_id: srv-d7nca3jrjlhs73adlf2g
          - name: dashboard-analytics
            url: https://dashboard-analytics-5j2k.onrender.com/health
            service_id: srv-d7mp31v7f7vs73fb5pa0
          - name: shopfull-backend
            url: https://shopfull-backend.onrender.com/api/products/
            service_id: srv-d7ipa8hj2pic73b09mb0

    steps:
      - name: Ping ${{ matrix.name }} (com tentativas)
        id: ping
        env:
          TARGET_URL: ${{ matrix.url }}
          SERVICE_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          healthy=false
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 15 --max-time 60 "$TARGET_URL") && exit_code=0 || exit_code=$?
            echo "$SERVICE_NAME: tentativa $attempt/3, HTTP $status, curl exit $exit_code"
            if [ "$exit_code" -eq 0 ] && [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              healthy=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          if [ "$healthy" != true ]; then
            echo "::warning::$SERVICE_NAME não respondeu com HTTP 2xx após 3 tentativas"
          fi

      - name: Solicitar redeploy se indisponível
        id: redeploy
        if: steps.ping.outputs.healthy != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ matrix.service_id }}
          SERVICE_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY não configurada. Não é possível recuperar $SERVICE_NAME."
            exit 1
          fi
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --connect-timeout 15 --max-time 30 --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys") && curl_exit=0 || curl_exit=$?
          rm -f "$response_file"
          if [ "$curl_exit" -ne 0 ] || [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Falha ao solicitar redeploy de $SERVICE_NAME (HTTP $http_code, curl exit $curl_exit)"
            exit 1
          fi
          echo "::notice::Redeploy solicitado para $SERVICE_NAME. Verifique a saúde do serviço no Render."
